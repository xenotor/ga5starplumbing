[project]
name = "ga5-ads"
version = "0.1.0"
description = "Georgia 5 Star Plumbing Meta ads build, attribution and optimization tooling"
requires-python = ">=3.12"
dependencies = ["requests>=2.32"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
ga5ads = "ga5_ads.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga5_ads"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
